# Default values for filecodebox.
# 覆盖示例: helm install filecodebox ./charts/filecodebox --set secret.adminPassword=xxx
#
# 架构(0.3+): 前后端分离两容器 ——
#   frontend Deployment(nginx: 静态资源 + API 反代) → server Deployment(API/数据)
#   Ingress 只指 frontend Service；server 镜像为纯后端(0.9.0 起不含前端,core 对
#   缺失 static 优雅降级)；两镜像同一版本列车(frontend.tag 缺省同 AppVersion，
#   由 server 仓 release 同步发布；compose 模板自 0.9.0 起同为分离编排)。

# ⚠️ 多副本需要外部 MySQL/Postgres + 对象存储(S3/WebDAV)，并使用支持多节点读写的卷；
#    SQLite 默认部署下请保持 1。
replicaCount: 1

# 容器内应用监听端口(镜像默认 12345，可用 env FCB_SERVER_PORT 覆盖后同步修改)
containerPort: 12345

image:
  repository: ghcr.io/filescodebox/server
  tag: ""            # 默认取 .Chart.AppVersion 并剥 v 前缀(ghcr tag 为 0.6.4 形态,无 v)
  pullPolicy: IfNotPresent

# 前端容器(nginx 静态 + API 反代): 无状态,不挂 PVC;后端地址自动指向本 release 的
# server Service,无需配置。frontend.tag 缺省同 AppVersion(与 server 同版本列车)。
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/filescodebox/frontend
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8080   # 镜像 nginx 以非 root(uid 101)监听 8080
  service:
    type: ClusterIP
    port: 80
    # nodePort: 30080   # type=NodePort 时可选固定端口
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 101     # nginx-unprivileged 镜像内置 uid
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /          # nginx 渲染配置在启动前完成,就绪即静态服务可用
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  extraEnv: []

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# 镜像内以 app 用户(uid/gid=1000)运行，/app/data 归属 1000:1000
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # 镜像根文件系统需可写(临时文件/日志回退)；如需收紧请配合 emptyDir 自行评估
  readOnlyRootFilesystem: false

service:
  # 后端(server) Service: 仅被 frontend 反代与 metrics 抓取直连,不对外;
  # 对外入口 = frontend.service(NodePort/Ingress/直连均走前端容器)
  type: ClusterIP
  port: 12345
  # nodePort: 30080   # type=NodePort 时可选固定端口

ingress:
  # Ingress 指向 frontend Service(nginx 容器), API 请求由其反代到后端;
  # 大上传走分片通道,超时/体积注解放这里即可作用于整条链路
  enabled: false
  className: ""
  # 文件上传场景建议(nginx ingress): proxy-body-size 按需放大, 并加长读写超时
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  annotations: {}
  hosts:
    - host: filecodebox.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: filecodebox-tls
  #    hosts:
  #      - filecodebox.local

# 数据持久化: SQLite 数据库 + 本地上传文件，对应容器内 /app/data。
# 多副本/生产建议关闭本地存储依赖: database.driver 改 mysql/postgres、storage.type 改 s3/webdav，
# 并可将 persistence.enabled 设为 false(此时数据写入容器 emptyDir，重启丢失)。
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

# 透传 server 配置(渲染为 ConfigMap，以 subPath 覆盖镜像内 /app/config/config.yaml)。
# 留空 = 使用镜像内置默认配置。敏感项(jwt_secret/密码)不要写在这里，走下方 secret(环境变量优先级更高)。
config: {}
#  server:
#    mode: release
#    base_url: https://filecodebox.example.com
#  database:
#    driver: mysql
#    host: mysql.data.svc.cluster.local
#    port: 3306
#    db_name: filecodebox
#  redis:
#    host: redis.data.svc.cluster.local
#  storage:
#    type: s3
#    s3:
#      endpoint: https://s3.example.com
#      region: us-east-1
#      bucket: filecodebox
#  observability:
#    tracing:
#      enabled: true
#      endpoint: otel-collector.observability:4317
#  security:
#    cors:
#      allow_origins:
#        - https://filecodebox.example.com

# 敏感配置 → K8s Secret，以 FCB_* 环境变量注入(优先级高于配置文件)。
secret:
  create: true
  # 已有 Secret(键为 FCB_* 形式)时不再创建；Deployment 改为引用它
  existingSecret: ""
  # 留空 = 安装时随机生成并写入 Secret，升级时复用既有值(基于 lookup，Argo CD 等纯渲染工具不生效，需显式指定)
  jwtSecret: ""
  adminPassword: "admin123"   # ⚠️ 生产必须覆盖，并建议同时开启 production
  production: false           # FCB_PRODUCTION=1: 强制校验 secret，生产建议 true
  serverMode: "release"       # FCB_SERVER_MODE: release | debug | test
  database: {}                # 附加 FCB_DATABASE_* 键值对，如 {HOST: mysql, PASSWORD: xxx}
  redis: {}                   # 附加 FCB_REDIS_* 键值对，如 {PASSWORD: xxx}
  extra: {}                   # 其他任意 FCB_* 键值对(键名原样注入)

# 可信代理网段(CIDR 列表)，以 FCB_TRUSTED_PROXIES(逗号分隔)注入。
# 反代/Ingress 部署必填：仅当直连对端在网段内才采信 X-Forwarded-For，
# 否则限流/失败锁定会把代理地址当成所有用户的来源而误伤。
# 前后端分离架构下后端直连对端 = frontend nginx Pod，XFF 链 =
# 客户端 → Ingress → frontend Pod → server，因此需同时覆盖
# Pod 网段(默认 10.42.0.0/16 / 10.244.0.0/16 一类)与 Ingress controller 网段。
trustedProxies: []
#  - 10.0.0.0/8
#  - 173.245.48.0/20

# ── 内置数据面服务 ──────────────────────────────────────────────────
# Redis: 匿名取件码映射/预签名/分布式限流/JWT 黑名单强依赖(缺失时这些功能
# 降级)。默认开启=与 docker compose 形态对齐、开箱即用;单副本+AOF+PVC。
# 生产/多副本建议 redis.enabled=false + config.redis.host 指向外部 Redis
# (config 里显式配置了 redis 段时本开关自动让位,不注入覆盖 env)。
# 三个组件均继承顶层 nodeSelector/tolerations/affinity(镜像手动导入的
# 离线集群注意把镜像导入到被调度的节点)。
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  auth:
    # 留空 = 无密码(仅集群内网可达);设置后开启 requirepass 并注入 FCB_REDIS_PASSWORD
    password: ""
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 32m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# 内置 MySQL 8.4(默认关): 开启即部署单副本 StatefulSet 并自动注入
# FCB_DATABASE_DRIVER/HOST/PORT/USER/PASSWORD/DB_NAME(env 优先级高于 config)。
# 生产建议外部 MySQL + config/secret 显式配置,保持本开关 false。
# 离线集群启用前先导入 mysql:8.4 镜像到被调度节点。
mysql:
  enabled: false
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  auth:
    username: filecodebox
    database: filecodebox
    # 留空 = 安装时随机生成并写入 Secret,升级复用既有值(lookup);
    # Argo CD 等纯渲染工具不生效,需显式指定
    userPassword: ""
    rootPassword: ""
  persistence:
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# 内置 PostgreSQL 17(默认关): 语义同 mysql。
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: filecodebox
    database: filecodebox
    userPassword: ""
  persistence:
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# 追加原生 env(完整 k8s env 对象数组)
extraEnv: []
#  - name: TZ
#    value: Asia/Shanghai

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    path: /metrics
    # namespace: monitoring
    labels: {}

probes:
  liveness:
    path: /live
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz   # 依赖(DB)就绪才接流量
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # 慢启动保护(PVC 挂载/首次迁移): 通过前不启动 liveness 计数, 最多容忍 ~3 分钟
  startup:
    enabled: true
    path: /live
    periodSeconds: 10
    failureThreshold: 18

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# 部署策略: 留空时自动判断 —— 启用新建持久卷(ReadWriteOnce)用 Recreate，其余 RollingUpdate
strategy: {}
#  type: RollingUpdate

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []
