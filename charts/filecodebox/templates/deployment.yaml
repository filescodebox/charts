apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filecodebox.fullname" . }}
  labels:
    {{- include "filecodebox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.strategy.type }}
  strategy:
    type: {{ .Values.strategy.type }}
  {{- else if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  # ReadWriteOnce 卷不支持跨节点多挂载，滚动更新会卡住，改用 Recreate
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "filecodebox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.config }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "filecodebox.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* 数据面接线: 内置 redis/mysql/postgresql → FCB_* env(env 优先级高于 config) */}}
      {{- $wireRedis := and .Values.redis.enabled (not (hasKey (.Values.config | default dict) "redis")) }}
      {{- if $wireRedis }}
      {{- /* core 仅在启动时探测 redis,连不上即降级——等 redis 就绪再起后端 */}}
      initContainers:
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "filecodebox.redis.fullname" . }} 6379; do echo waiting for redis; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "filecodebox.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "filecodebox.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "filecodebox.secretName" . }}
          {{- $wireRedis := and .Values.redis.enabled (not (hasKey (.Values.config | default dict) "redis")) }}
          {{- if or .Values.trustedProxies .Values.extraEnv $wireRedis .Values.mysql.enabled .Values.postgresql.enabled }}
          env:
            {{- with .Values.trustedProxies }}
            - name: FCB_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $wireRedis }}
            - name: FCB_REDIS_HOST
              value: {{ include "filecodebox.redis.fullname" . }}
            - name: FCB_REDIS_PORT
              value: "6379"
            {{- if .Values.redis.auth.password }}
            - name: FCB_REDIS_PASSWORD
              value: {{ .Values.redis.auth.password | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.mysql.enabled }}
            - name: FCB_DATABASE_DRIVER
              value: mysql
            - name: FCB_DATABASE_HOST
              value: {{ include "filecodebox.mysql.fullname" . }}
            - name: FCB_DATABASE_PORT
              value: "3306"
            - name: FCB_DATABASE_USER
              value: {{ .Values.mysql.auth.username | quote }}
            - name: FCB_DATABASE_DB_NAME
              value: {{ .Values.mysql.auth.database | quote }}
            - name: FCB_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "filecodebox.mysql.fullname" . }}
                  key: user-password
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: FCB_DATABASE_DRIVER
              value: postgres
            - name: FCB_DATABASE_HOST
              value: {{ include "filecodebox.postgresql.fullname" . }}
            - name: FCB_DATABASE_PORT
              value: "5432"
            - name: FCB_DATABASE_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: FCB_DATABASE_DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: FCB_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "filecodebox.postgresql.fullname" . }}
                  key: user-password
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.config }}
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "filecodebox.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "filecodebox.fullname" . }}-config
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
