apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filecodebox.fullname" . }}
  labels:
    {{- include "filecodebox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.strategy.type }}
  strategy:
    type: {{ .Values.strategy.type }}
  {{- else if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  # ReadWriteOnce 卷不支持跨节点多挂载，滚动更新会卡住，改用 Recreate
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "filecodebox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.config }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "filecodebox.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* 数据面接线: 内置 redis/mysql/postgresql/s3(SeaweedFS) → FCB_* env(env 优先级高于 config)。
         让位判断用取值判空而非 hasKey: config.<段>=null(helm --set xxx=null 删除语义)也算未显式配置 */}}
      {{- $wireRedis := and .Values.redis.enabled (not (get (.Values.config | default dict) "redis")) }}
      {{- $wireS3 := and .Values.s3.enabled (not (get (.Values.config | default dict) "storage")) }}
      {{- if or $wireRedis $wireS3 }}
      initContainers:
        {{- if $wireRedis }}
        {{- /* core 仅在启动时探测 redis,连不上即降级——等 redis 就绪再起后端; 用 redis 镜像自带 redis-cli,不引入额外镜像 */}}
        - name: wait-redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag | default "7-alpine" }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: ["sh", "-c", "until redis-cli -h {{ include "filecodebox.redis.fullname" . }} ping 2>/dev/null | grep -q PONG; do echo waiting for redis; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
        {{- end }}
        {{- if $wireS3 }}
        {{- /* 桶存在 ⇒ S3 网关就绪, head-bucket 探测+建桶一步完成; aws-cli 走 SigV4 而非 minio 专有客户端 */}}
        - name: wait-s3-bucket
          image: {{ .Values.s3.initImage.repository }}:{{ .Values.s3.initImage.tag }}
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.s3.auth.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "filecodebox.s3.fullname" . }}
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | default "us-east-1" }}
            - name: S3_ENDPOINT
              value: http://{{ include "filecodebox.s3.fullname" . }}:8333
          command: ["sh", "-c", "until aws --endpoint-url \"$S3_ENDPOINT\" s3api head-bucket --bucket {{ .Values.s3.bucket }} 2>/dev/null; do aws --endpoint-url \"$S3_ENDPOINT\" s3api create-bucket --bucket {{ .Values.s3.bucket }} || true; echo waiting for s3; sleep 5; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
        {{- end }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "filecodebox.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "filecodebox.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "filecodebox.secretName" . }}
          {{- $wireRedis := and .Values.redis.enabled (not (get (.Values.config | default dict) "redis")) }}
          {{- $wireS3 := and .Values.s3.enabled (not (get (.Values.config | default dict) "storage")) }}
          {{- if or .Values.trustedProxies .Values.extraEnv $wireRedis $wireS3 .Values.mysql.enabled .Values.postgresql.enabled }}
          env:
            {{- with .Values.trustedProxies }}
            - name: FCB_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $wireRedis }}
            - name: FCB_REDIS_HOST
              value: {{ include "filecodebox.redis.fullname" . }}
            - name: FCB_REDIS_PORT
              value: "6379"
            {{- if .Values.redis.auth.password }}
            - name: FCB_REDIS_PASSWORD
              value: {{ .Values.redis.auth.password | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.mysql.enabled }}
            - name: FCB_DATABASE_DRIVER
              value: mysql
            - name: FCB_DATABASE_HOST
              value: {{ include "filecodebox.mysql.fullname" . }}
            - name: FCB_DATABASE_PORT
              value: "3306"
            - name: FCB_DATABASE_USER
              value: {{ .Values.mysql.auth.username | quote }}
            - name: FCB_DATABASE_DB_NAME
              value: {{ .Values.mysql.auth.database | quote }}
            - name: FCB_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "filecodebox.mysql.fullname" . }}
                  key: user-password
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: FCB_DATABASE_DRIVER
              value: postgres
            - name: FCB_DATABASE_HOST
              value: {{ include "filecodebox.postgresql.fullname" . }}
            - name: FCB_DATABASE_PORT
              value: "5432"
            - name: FCB_DATABASE_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: FCB_DATABASE_DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: FCB_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "filecodebox.postgresql.fullname" . }}
                  key: user-password
            {{- end }}
            {{- if $wireS3 }}
            {{- /* storage.s3 env 映射需 core v0.7.7+(server 镜像 >= 0.9.3);
               集群内端点是私网地址,须放开 core 的 SSRF 端点防护才可用 */}}
            - name: FCB_SSRF_ALLOW_PRIVATE
              value: "true"
            - name: FCB_STORAGE_TYPE
              value: s3
            - name: FCB_STORAGE_S3_ENDPOINT
              value: http://{{ include "filecodebox.s3.fullname" . }}:8333
            - name: FCB_STORAGE_S3_REGION
              value: {{ .Values.s3.region | default "us-east-1" }}
            - name: FCB_STORAGE_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: FCB_STORAGE_S3_ACCESS_KEY
              value: {{ .Values.s3.auth.accessKey | quote }}
            - name: FCB_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "filecodebox.s3.fullname" . }}
                  key: secret-key
            - name: FCB_STORAGE_S3_USE_SSL
              value: "false"
            - name: FCB_STORAGE_S3_PATH_STYLE
              value: "true"
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.config }}
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "filecodebox.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "filecodebox.fullname" . }}-config
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
