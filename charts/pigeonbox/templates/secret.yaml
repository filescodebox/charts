{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pigeonbox.secretName" . }}
  labels:
    {{- include "pigeonbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  PB_JWT_SECRET: {{ include "pigeonbox.jwtSecret" . | quote }}
  PB_ADMIN_PASSWORD: {{ include "pigeonbox.adminPassword" . | quote }}
  PB_PRODUCTION: {{ ternary "1" "0" .Values.secret.production | quote }}
  {{- with .Values.secret.serverMode }}
  PB_SERVER_MODE: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.database }}
  PB_DATABASE_{{ upper $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.redis }}
  PB_REDIS_{{ upper $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
