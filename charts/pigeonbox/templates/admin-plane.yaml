{{/* 多副本拆分面(admin): 仅 replicaCount>1 时渲染。
   admin server(管理面单实例,FCB_DEPLOY_MODE=admin) + ClusterIP Service;
   serverAdmin.ingress.enabled 时附一个反代到 admin server 的 frontend 副本
   (server 镜像为纯后端,管理控制台 SPA 需 nginx 静态层)与 Ingress。
   公网入口(ingress.yaml)永远只指 public/frontend,admin 面不对外。 */}}
{{- $split := gt (int .Values.replicaCount) 1 }}
{{- if $split }}
{{- $adminName := include "pigeonbox.server.fullname" (dict "root" . "plane" "admin") }}
---
{{ include "pigeonbox.server.deployment" (dict "root" . "plane" "admin") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $adminName }}
  labels:
    {{- include "pigeonbox.server.labels" (dict "root" . "plane" "admin") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pigeonbox.server.selectorLabels" (dict "root" . "plane" "admin") | nindent 4 }}
{{- if .Values.serverAdmin.ingress.enabled }}
{{- $adminFrontendName := printf "%s-admin-ui" .Release.Name | trunc 63 | trimSuffix "-" }}
---
{{/* admin frontend: 与 frontend 同镜像同安全上下文,仅反代上游指向 admin server */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $adminFrontendName }}
  labels:
    helm.sh/chart: {{ include "pigeonbox.chart" . }}
    app.kubernetes.io/name: {{ include "pigeonbox.name" . }}-admin-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin-frontend
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pigeonbox.name" . }}-admin-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pigeonbox.name" . }}-admin-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: admin-frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          image: {{ include "pigeonbox.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          # 反代上游 = admin server Service(镜像 envsubst 渲染进 nginx 配置)
          env:
            - name: BACKEND_HOST
              value: {{ $adminName }}
            - name: BACKEND_PORT
              value: {{ .Values.service.port | quote }}
            - name: CLIENT_MAX_BODY_SIZE
              value: {{ .Values.frontend.clientMaxBodySize | default "20m" | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml (.Values.serverAdmin.frontend.resources | default .Values.frontend.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $adminFrontendName }}
  labels:
    app.kubernetes.io/name: {{ include "pigeonbox.name" . }}-admin-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin-frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "pigeonbox.name" . }}-admin-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{/* admin Ingress: 建议注解挂 IP 白名单/内网认证(见 values.yaml serverAdmin 示例) */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $adminFrontendName }}
  labels:
    helm.sh/chart: {{ include "pigeonbox.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.serverAdmin.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.serverAdmin.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.serverAdmin.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.serverAdmin.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $adminFrontendName }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
