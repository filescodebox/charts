apiVersion: v1
kind: Service
metadata:
  name: {{ include "pigeonbox.fullname" . }}
  labels:
    {{- include "pigeonbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "pigeonbox.selectorLabels" . | nindent 4 }}
    {{- /* 多副本拆分: 只选 public 平面(server-public),避免把 admin 单实例
       卷进公开面端点;单机模式不带 component,选择器与历史版本一致 */}}
    {{- if gt (int .Values.replicaCount) 1 }}
    app.kubernetes.io/component: server-public
    {{- end }}
