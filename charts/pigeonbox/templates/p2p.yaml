{{- if .Values.p2p.enabled }}
{{/*
P2P 联邦注册中心(可选组件,M2): 内存存储无状态——节点断线自动重注册,
registry 重启不丢联邦(租约 TTL 内自动补),故不需要 PVC。
后端接入: server/fnos 配置 federation.registry_url 指向本 Service。
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pigeonbox.p2p.fullname" . }}
  labels:
    {{- include "pigeonbox.data.labels" (dict "component" "p2p" "Release" .Release "Values" .Values "Chart" .Chart "Template" .Template) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pigeonbox.data.selectorLabels" (dict "component" "p2p" "Release" .Release "Values" .Values "Chart" .Chart "Template" .Template) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pigeonbox.data.selectorLabels" (dict "component" "p2p" "Release" .Release "Values" .Values "Chart" .Chart "Template" .Template) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: p2p
          securityContext:
            # 镜像内已 USER app(uid 1000),显式声明满足 restricted PSA
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: {{ .Values.p2p.image.repository }}:{{ .Values.p2p.image.tag | default "0.1" }}
          imagePullPolicy: {{ .Values.p2p.image.pullPolicy }}
          {{- if .Values.p2p.adminPassword }}
          env:
            - name: PB_P2P_ADMIN_PASSWORD
              value: {{ .Values.p2p.adminPassword | quote }}
          {{- end }}
          {{- if .Values.p2p.relay.enabled }}
          env:
            - name: PB_P2P_RELAY_ENABLED
              value: "true"
            {{- if .Values.p2p.relay.mbps }}
            - name: PB_P2P_RELAY_MBPS
              value: {{ .Values.p2p.relay.mbps | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 12346
              protocol: TCP
            {{- if .Values.p2p.relay.enabled }}
            - name: relay
              containerPort: 12347
              protocol: TCP
            {{- end }}
          # /health 未注册 HEAD,探针必须显式 GET
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.p2p.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pigeonbox.p2p.fullname" . }}
  labels:
    {{- include "pigeonbox.data.labels" (dict "component" "p2p" "Release" .Release "Values" .Values "Chart" .Chart "Template" .Template) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 12346
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.p2p.relay.enabled }}
    - port: 12347
      targetPort: relay
      protocol: TCP
      name: relay
    {{- end }}
  selector:
    {{- include "pigeonbox.data.selectorLabels" (dict "component" "p2p" "Release" .Release "Values" .Values "Chart" .Chart "Template" .Template) | nindent 4 }}
{{- end }}
