# Default values for pigeonbox.
# 覆盖示例: helm install pigeonbox ./charts/pigeonbox --set secret.adminPassword=xxx
#
# 架构(0.3+): 前后端分离两容器 ——
#   frontend Deployment(nginx: 静态资源 + API 反代) → server Deployment(API/数据)
#   Ingress 只指 frontend Service；server 镜像为纯后端(0.9.0 起不含前端,core 对
#   缺失 static 优雅降级)；两镜像同一版本列车(frontend.tag 缺省同 AppVersion，
#   由 server 仓 release 同步发布；compose 模板自 0.9.0 起同为分离编排)。

# ⚠️ 多副本(replicaCount>1)硬约束: 外部或内置 MySQL/Postgres + Redis(广播依赖)
#    + 多节点可读的存储(S3 后端或 RWX 卷);SQLite 只支持单副本请保持 1。
#    拆分后自动渲染: server(PB_DEPLOY_MODE=public,可扩副本) + server-admin
#    (PB_DEPLOY_MODE=admin,全局 1 实例: 管理路由/后台任务/DB 迁移/配置唯一写者)。
replicaCount: 1

# ── admin 管理面(仅 replicaCount>1 拆分模式生效)─────────────────────────
# 管理端访问: 开启 serverAdmin.ingress 走独立域名(建议注解挂 IP 白名单/内网认证),
# 或不开 Ingress 用 `kubectl port-forward svc/<release>-admin 12345` 直连 API。
# 公网入口(ingress.*)永远只指 public 面,管理面 API 在 public 副本上物理 404。
serverAdmin:
  ingress:
    enabled: false
    className: ""
    # nginx ingress 示例:
    # annotations:
    #   nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
    annotations: {}
    hosts:
      - host: admin.pigeonbox.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  # admin 控制台 frontend 副本(nginx→admin server)资源;缺省沿用 frontend.resources
  frontend:
    resources: {}
    #  requests:
    #    cpu: 50m
    #    memory: 64Mi

# 容器内应用监听端口(镜像默认 12345，可用 env PB_SERVER_PORT 覆盖后同步修改)
containerPort: 12345

image:
  repository: ghcr.io/pigeonbox/server
  tag: ""            # 默认取 .Chart.AppVersion 并剥 v 前缀(ghcr tag 为 0.14.0 形态,无 v)
  pullPolicy: IfNotPresent

# 前端容器(nginx 静态 + API 反代): 无状态,不挂 PVC;后端地址自动指向本 release 的
# server Service,无需配置。frontend.tag 缺省同 AppVersion(与 server 同版本列车)。
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/pigeonbox/frontend
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8080   # 镜像 nginx 以非 root(uid 101)监听 8080
  # nginx client_max_body_size: 反代链路体积上限,须 >= upload.upload_size。
  # 镜像默认 20m 是隐性瓶颈(分片上传单分片小不受影响,但多文件 zip 流式下载/
  # 大请求体会被 nginx 先拒);后端自身仍有 upload.upload_size 强校验,nginx 放宽即可
  clientMaxBodySize: "1024m"
  service:
    type: ClusterIP
    port: 80
    # nodePort: 30080   # type=NodePort 时可选固定端口
  podLabels: {}
  podSecurityContext: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 101     # nginx-unprivileged 镜像内置 uid
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  probes:
    liveness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /          # nginx 渲染配置在启动前完成,就绪即静态服务可用
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  extraEnv: []

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# 镜像内以 app 用户(uid/gid=1000)运行，/app/data 归属 1000:1000
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # 镜像根文件系统需可写(临时文件/日志回退)；如需收紧请配合 emptyDir 自行评估
  readOnlyRootFilesystem: false

service:
  # 后端(server) Service: 仅被 frontend 反代与 metrics 抓取直连,不对外;
  # 对外入口 = frontend.service(NodePort/Ingress/直连均走前端容器)
  type: ClusterIP
  port: 12345
  # nodePort: 30080   # type=NodePort 时可选固定端口

ingress:
  # Ingress 指向 frontend Service(nginx 容器), API 请求由其反代到后端;
  # 大上传走分片通道,超时/体积注解放这里即可作用于整条链路
  enabled: false
  className: ""
  # 文件上传场景建议(nginx ingress): proxy-body-size 按需放大, 并加长读写超时
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  annotations: {}
  hosts:
    - host: pigeonbox.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: pigeonbox-tls
  #    hosts:
  #      - pigeonbox.local

# 数据持久化: SQLite 数据库 + 本地上传文件，对应容器内 /app/data。
# 多副本/生产建议关闭本地存储依赖: database.driver 改 mysql/postgres、storage.type 改 s3/webdav，
# 并可将 persistence.enabled 设为 false(此时数据写入容器 emptyDir，重启丢失)。
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

# 透传 server 配置(渲染为 ConfigMap，以 subPath 覆盖镜像内 /app/config/config.yaml)。
# 留空 = 使用镜像内置默认配置。敏感项(jwt_secret/密码)不要写在这里，走下方 secret(环境变量优先级更高)。
config: {}
#  server:
#    mode: release
#    base_url: https://pigeonbox.example.com
#  database:
#    driver: mysql
#    host: mysql.data.svc.cluster.local
#    port: 3306
#    db_name: pigeonbox
#  redis:
#    host: redis.data.svc.cluster.local
#  storage:
#    type: s3
#    s3:
#      endpoint: https://s3.example.com
#      region: us-east-1
#      bucket: pigeonbox
#  observability:
#    tracing:
#      enabled: true
#      endpoint: otel-collector.observability:4317
#  security:
#    cors:
#      allow_origins:
#        - https://pigeonbox.example.com

# 敏感配置 → K8s Secret，以 PB_* 环境变量注入(优先级高于配置文件)。
secret:
  create: true
  # 已有 Secret(键为 PB_* 形式)时不再创建；Deployment 改为引用它
  existingSecret: ""
  # 留空 = 安装时随机生成并写入 Secret，升级时复用既有值(基于 lookup，Argo CD 等纯渲染工具不生效，需显式指定)
  jwtSecret: ""
  # 留空 = 安装时随机生成并写入 Secret(取回: kubectl get secret <名称> -o jsonpath="{.data.PB_ADMIN_PASSWORD}" | base64 -d)；升级复用既有值
  adminPassword: ""
  production: false           # PB_PRODUCTION=1: 强制校验 secret，生产建议 true
  serverMode: "release"       # PB_SERVER_MODE: release | debug | test
  database: {}                # 附加 PB_DATABASE_* 键值对，如 {HOST: mysql, PASSWORD: xxx}
  redis: {}                   # 附加 PB_REDIS_* 键值对，如 {PASSWORD: xxx}
  extra: {}                   # 其他任意 PB_* 键值对(键名原样注入)

# 可信代理网段(CIDR 列表)，以 PB_TRUSTED_PROXIES(逗号分隔)注入。
# 反代/Ingress 部署必填：仅当直连对端在网段内才采信 X-Forwarded-For，
# 否则限流/失败锁定会把代理地址当成所有用户的来源而误伤。
# 前后端分离架构下后端直连对端 = frontend nginx Pod，XFF 链 =
# 客户端 → Ingress → frontend Pod → server，因此需同时覆盖
# Pod 网段(默认 10.42.0.0/16 / 10.244.0.0/16 一类)与 Ingress controller 网段。
trustedProxies: []
#  - 10.0.0.0/8
#  - 173.245.48.0/20

# ── 内置数据面服务 ──────────────────────────────────────────────────
# Redis: 取件码映射/presign 会话的持久化与多副本共享面(core v0.14.0 起单机关闭
# 亦可全功能运行——进程内 KV,重启丢失映射)。默认开启=与 docker compose 形态
# 对齐、开箱即用;单副本+AOF+PVC。
# 多副本(replicaCount>1)必须保持可用 Redis(配置广播依赖);生产建议指向外部
# Redis(redis.enabled=false + config.redis.host;config 显式配置 redis 段时
# 本开关自动让位,不注入覆盖 env)。
# 三个组件均继承顶层 nodeSelector/tolerations/affinity(镜像手动导入的
# 离线集群注意把镜像导入到被调度的节点)。
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  auth:
    # 留空 = 无密码(仅集群内网可达);设置后开启 requirepass 并注入 PB_REDIS_PASSWORD
    password: ""
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 32m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# P2P 联邦注册中心(可选组件,M2;默认关): 开启即部署单副本 p2p(节点注册/
# 口令联邦路由,内存存储无状态),同时把后端 env 注入 PB_FEDERATION_* 指向它。
# 集群内 Service: <release>-p2p:12346;config 显式配置 federation 段时本开关让位。
# 镜像 ghcr.io/pigeonbox/p2p 为 public,离线集群需手动导入。
p2p:
  enabled: false
  image:
    repository: ghcr.io/pigeonbox/p2p
    tag: "0.4"
    pullPolicy: IfNotPresent
  # 本站对外地址(取件方直连下载用): 留空自动取 config.server.base_url;
  # 都为空则不注入该项,联邦初始化会失败降级(日志可见)
  publicURL: ""
  # 管理端口令(留空=管理 API 禁用)
  adminPassword: ""
  # 加密中继(M3 设备直传兜底): 默认关;开启后 Service 暴露 12347/TCP
  relay:
    enabled: false
    mbps: 10
  resources:
    requests:
      cpu: 32m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# 内置 MySQL 8.4(默认关): 开启即部署单副本 StatefulSet 并自动注入
# PB_DATABASE_DRIVER/HOST/PORT/USER/PASSWORD/DB_NAME(env 优先级高于 config)。
# 生产建议外部 MySQL + config/secret 显式配置,保持本开关 false。
# 离线集群启用前先导入 mysql:8.4 镜像到被调度节点。
mysql:
  enabled: false
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  auth:
    username: pigeonbox
    database: pigeonbox
    # 留空 = 安装时随机生成并写入 Secret,升级复用既有值(lookup);
    # Argo CD 等纯渲染工具不生效,需显式指定
    userPassword: ""
    rootPassword: ""
  persistence:
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# 内置 PostgreSQL 17(默认关): 语义同 mysql。
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: pigeonbox
    database: pigeonbox
    userPassword: ""
  persistence:
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# 内置 S3 对象存储(默认关): SeaweedFS 单进程(master+volume+filer+s3),开启即部署
# 单副本 StatefulSet + 自动建桶,并自动注入 PB_STORAGE_TYPE/PB_STORAGE_S3_*
# 与 PB_SSRF_ALLOW_PRIVATE(集群内端点属私网,须放开 core 的 SSRF 防护;
# env 优先级高于 config)。适合无外部对象存储的单集群生产形态;已有 S3/WebDAV 时保持 false。
# 选型说明: MinIO 2025-06 起停止发布社区容器镜像(docker.io/quay.io 均拒绝匿名拉取),
# 故改用仍持续发布官方多架构镜像的 SeaweedFS(Apache-2.0)。
# 离线集群启用前先导入 seaweedfs 与 aws-cli 镜像到被调度节点。
# ⚠️ 需要 server 镜像 >= 0.9.3(此前 core 未映射 PB_STORAGE_S3_* env)。
s3:
  enabled: false
  image:
    repository: ghcr.io/chrislusf/seaweedfs
    tag: "4.48"
    pullPolicy: IfNotPresent
  # 建桶 init 容器(AWS 官方 aws-cli, 持续发布多架构; 走标准 SigV4)
  initImage:
    repository: amazon/aws-cli
    tag: "2.32.8"
  auth:
    accessKey: pigeonbox
    # 留空 = 安装时随机生成并写入 Secret,升级复用既有值(lookup)
    secretKey: ""
  bucket: pigeonbox
  region: us-east-1
  # 建桶后自动写入的桶 CORS(幂等)。直传/直下等浏览器直连桶的场景必需;
  # 注意预签名 URL 由 storage.s3.endpoint 生成——内置实例端点在集群内,浏览器不可达,
  # 这类用法请外接 S3 并以 config.storage 指向对外端点(内置实例自动让位,凭据/桶可复用)。
  # 留空 [] 关闭自动 CORS。默认 * (文件分享场景;收紧请改为站点 origin 列表)
  corsOrigins:
    - "*"
  persistence:
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# 追加原生 env(完整 k8s env 对象数组)
extraEnv: []
#  - name: TZ
#    value: Asia/Shanghai

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    path: /metrics
    # namespace: monitoring
    labels: {}

probes:
  liveness:
    path: /live
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz   # 依赖(DB)就绪才接流量
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # 慢启动保护(PVC 挂载/首次迁移): 通过前不启动 liveness 计数, 最多容忍 ~3 分钟
  startup:
    enabled: true
    path: /live
    periodSeconds: 10
    failureThreshold: 18

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# 部署策略: 留空时自动判断 —— 启用新建持久卷(ReadWriteOnce)用 Recreate，其余 RollingUpdate
strategy: {}
#  type: RollingUpdate

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []
