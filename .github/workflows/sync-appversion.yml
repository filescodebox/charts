name: Sync AppVersion

# 组件发版自动对齐 chart：
#   server 仓打 v* tag → Release 成功后 repository_dispatch(component-release)
#   触发本工作流 → appVersion 对齐组件版本、chart version patch 自动 +1 → push main。
#
# 发版触发(2026-10-08 治理):push 用 RELEASE_PAT——PAT 的 push 会触发 on:push 的
# Release Charts 工作流,消除旧链路「GITHUB_TOKEN push 不触发 + 显式 curl dispatch
# 单点」的半断裂形态(RELEASE_PAT 失效时提交落库而 chart 永不发版,1.3.12/13/14 事故)。
# 镜像 tag 缺省取 AppVersion 剥 v 前缀(_helpers.tpl)，改 Chart.yaml 一处即同时
# 锁定 server/frontend 两镜像。
# workflow_dispatch 支持手工补齐/修复(输入形如 v0.12.5 或 0.12.5，统一带 v 落盘)。
# 幂等：appVersion 已对齐时按「目标 chart Release 是否已存在」决定补发,不再看 changed 标志
# (重跑/回放也能补上历史断链缺失的发版)。

on:
  repository_dispatch:
    types: [component-release]
  workflow_dispatch:
    inputs:
      app_version:
        description: '组件版本（如 v0.12.5 或 0.12.5）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target version
        id: ver
        run: |
          RAW="${{ inputs.app_version || github.event.client_payload.app_version }}"
          if [ -z "$RAW" ]; then
            echo "::error::未提供 app_version（repository_dispatch 需要 client_payload.app_version）"
            exit 1
          fi
          APP="v${RAW#v}"          # 统一带 v 落盘(appVersion 惯例)
          TAG="${APP#v}"           # 镜像 tag 无 v 前缀(ghcr 形态)，仅用于日志核对
          echo "app=$APP tag=$TAG"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Compute chart version bump
        id: chart
        run: |
          CUR=$(awk '/^version:/ {print $2}' charts/pigeonbox/Chart.yaml)
          MAJOR=$(echo "$CUR" | cut -d. -f1)
          MINOR=$(echo "$CUR" | cut -d. -f2)
          PATCH=$(echo "$CUR" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "cur=$CUR next=$NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Align Chart.yaml
        id: align
        run: |
          APP="${{ steps.ver.outputs.app }}"
          CUR_APP=$(awk '/^appVersion:/ {print $2}' charts/pigeonbox/Chart.yaml | tr -d '"')
          if [ "$CUR_APP" = "$APP" ]; then
            echo "appVersion 已是 $APP（重复触发/回放），changed=false"
          else
            sed -i "s|^appVersion: .*|appVersion: \"$APP\"|" charts/pigeonbox/Chart.yaml
            sed -i "s|^version: .*|version: ${{ steps.chart.outputs.next }}|" charts/pigeonbox/Chart.yaml
            echo "--- Chart.yaml 版本段 ---"
            grep -E '^(version|appVersion):' charts/pigeonbox/Chart.yaml
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "next_chart=$(awk '/^version:/ {print $2}' charts/pigeonbox/Chart.yaml)" >> "$GITHUB_OUTPUT"

      # PAT 的 push 才会触发 on:push 的 Release Charts 工作流(GITHUB_TOKEN 被 GitHub
      # 防递归限制静默跳过——chart 1.3.12/13/14 从未发版的根因)。RELEASE_PAT 缺失
      # 或失效必须在此处响,而不是等「提交落库、永不发版」。
      - name: Commit and push(RELEASE_PAT,触发发版)
        if: steps.align.outputs.changed == 'true'
        env:
          PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::缺 secret RELEASE_PAT——PAT push 才能触发 Release Charts(GITHUB_TOKEN 不触发工作流)。Settings→Secrets→Actions 配置后重跑。"
            exit 1
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          git add charts/pigeonbox/Chart.yaml
          git commit -m "chore(release): appVersion → ${{ steps.ver.outputs.app }}（chart ${{ steps.chart.outputs.next }}，组件发版自动对齐）"
          git push

      # 幂等兜底:appVersion 已对齐但目标 chart Release 缺失(历史断链/发版失败) → 显式补发
      - name: 补发检查(release 缺失才触发)
        if: steps.align.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          REL="pigeonbox-${{ steps.align.outputs.next_chart }}"
          if gh release view "$REL" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "chart $REL 已发布,无需补发"
          else
            echo "chart $REL 缺失(历史断链),显式触发 Release Charts"
            gh workflow run release.yml -R "${{ github.repository }}" --ref main
          fi
