name: Lint and Test Charts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      # PR:ct 按变更检测跑 lint+install；
      # push 到 main:ct 的变更检测以 target-branch(=HEAD) 为基线恒空,曾 0 秒空跑、
      # kind 冒烟从未真正执行(--since 对其 version-bump 检查语义也不符,0.2.7 误报)——
      # 故 push 改为下方显式 helm 安装冒烟,零隐式行为。
      - name: Run chart-testing (list-changed)
        id: list-changed
        if: github.event_name != 'push'
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: github.event_name != 'push' && steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      # 多副本拆分拓扑守卫(纯渲染,无需集群):replicaCount>1 必须渲染出
      # public×N + admin×1 双平面 + admin 控制台入口链,且 server Service 只选 public 平面
      - name: Render split-mode topology (PR)
        if: github.event_name != 'push'
        run: |
          out=$(helm template fcb charts/pigeonbox \
            --set replicaCount=2 --set serverAdmin.ingress.enabled=true)
          echo "$out" | grep -q 'value: "public"'
          echo "$out" | grep -q 'value: "admin"'
          echo "$out" | grep -q 'component: server-public'
          echo "$out" | grep -q 'component: server-admin'
          n=$(echo "$out" | grep -c '^kind: Deployment')
          [ "$n" -eq 5 ] || { echo "::error::拆分模式应渲染 5 个 Deployment(public/admin/frontend/admin-frontend/redis)，实得 $n"; exit 1; }
          echo "split topology OK"

      - name: Create kind cluster
        if: github.event_name == 'push' || steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      # chart bump 与 server 打 tag 几乎同时(依赖升级提交同时触发两条流水线),
      # 多架构镜像(qemu arm64)要 10-30 分钟才 publish;kind 只等 5m,不等镜像
      # 就会 ImagePullBackOff 超时(0.2.12/0.2.13 均如此)。
      # 探测用 docker pull 重试——ghcr 的 registry HTTP API 对 runner 网段匿名
      # manifest GET 恒 401(本机同请求 200),不可用作探测;docker 拉取路径没问题。
      # 拉到后 kind load 预载,部署按 IfNotPresent 直接用,不依赖节点实时拉取。
      - name: Wait for app images & preload into kind (push)
        if: github.event_name == 'push'
        run: |
          tag=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' charts/pigeonbox/Chart.yaml)
          tag=${tag#v}
          # 前后端分离落地(chart 带 frontend-deployment)后,两镜像同版本列车都要等;
          # 两路并行等待(qemu 多架构 10-30 分钟,串行会顶到 45 分钟窗口边缘)
          images="server"
          [ -f charts/pigeonbox/templates/frontend-deployment.yaml ] && images="server frontend"
          pull_one() {
            local ref="ghcr.io/pigeonbox/$1:${tag}" i
            echo "等待 ${ref} 可拉取..."
            for i in $(seq 1 90); do
              if docker pull -q "$ref" >/dev/null 2>&1; then echo "  ✓ $ref"; return 0; fi
              sleep 30
            done
            echo "::error::${ref} 45 分钟内未发布——对应 Release 未跑或失败"
            return 1
          }
          for image in $images; do pull_one "$image" & done
          fails=0
          for j in $(jobs -p); do wait "$j" || fails=1; done
          [ "$fails" = 0 ] || exit 1
          for image in $images; do
            kind load docker-image "ghcr.io/pigeonbox/${image}:${tag}" --name chart-testing
          done

      - name: Real install smoke (push)
        if: github.event_name == 'push'
        run: |
          helm lint charts/pigeonbox
          helm upgrade --install fcb charts/pigeonbox -n fcb-ci --create-namespace \
            -f charts/pigeonbox/ci/config-overlay-values.yaml --wait --timeout 5m
          kubectl -n fcb-ci rollout status deploy -l app.kubernetes.io/instance=fcb --timeout=5m
          helm test fcb -n fcb-ci

      # 内置对象存储实装验证(默认关闭,独立 namespace 验证建桶 init + PB_STORAGE_* 接线)
      # --set config.storage=null 删掉 overlay 的 config.storage 段,让内置接线真正生效
      #(显式 config.storage 存在时 chart 让位,冒烟就变成空转了)
      - name: S3 (SeaweedFS) install smoke (push)
        if: github.event_name == 'push'
        run: |
          helm upgrade --install fcb-s3 charts/pigeonbox -n fcb-s3 --create-namespace \
            -f charts/pigeonbox/ci/config-overlay-values.yaml \
            --set fullnameOverride=fcb-s3 --set s3.enabled=true --set config.storage=null \
            --wait --timeout 10m
          kubectl -n fcb-s3 rollout status statefulset/fcb-s3-s3 --timeout=5m
          kubectl -n fcb-s3 rollout status deploy/fcb-s3 --timeout=10m
          kubectl -n fcb-s3 get deploy fcb-s3 -o jsonpath='{.spec.template.spec.initContainers[*].name}' | grep -q wait-s3-bucket
          helm test fcb-s3 -n fcb-s3

      # 冒烟失败时必须留下 Pod 级证据:此前三连挂时失败日志只有一行
      # "Deployment not ready 0/1",分不清是镜像未发布/init 容器卡住/探针语法哪层的问题。
      - name: Dump failure diagnostics (push)
        if: failure() && github.event_name == 'push'
        run: |
          for ns in fcb-ci fcb-s3; do
            echo "════════ 命名空间 $ns ════════"
            kubectl -n "$ns" get deploy,sts,po -o wide || true
            echo '──────── events ────────'
            kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -40 || true
            for p in $(kubectl -n "$ns" get po -o name); do
              echo "──────── $p ────────"
              kubectl -n "$ns" describe "$p" | sed -n '/^Events:/,$p' || true
              kubectl -n "$ns" logs "$p" --all-containers --init-containers --tail=50 || true
            done
          done

      - name: Run chart-testing (install)
        if: github.event_name != 'push' && steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}
