name: Lint and Test Charts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      # PR:ct 按变更检测跑 lint+install；
      # push 到 main:ct 的变更检测以 target-branch(=HEAD) 为基线恒空,曾 0 秒空跑、
      # kind 冒烟从未真正执行(--since 对其 version-bump 检查语义也不符,0.2.7 误报)——
      # 故 push 改为下方显式 helm 安装冒烟,零隐式行为。
      - name: Run chart-testing (list-changed)
        id: list-changed
        if: github.event_name != 'push'
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: github.event_name != 'push' && steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: github.event_name == 'push' || steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      # chart bump 与 server 打 tag 几乎同时(依赖升级提交同时触发两条流水线),
      # 多架构镜像(qemu arm64)常要 10+ 分钟才 publish;kind 只等 5m,不等镜像
      # 就会 ImagePullBackOff 超时(0.2.12/0.2.13 均如此)。匿名轮询 ghcr 至 tag 可拉。
      - name: Wait for app image (appVersion) to be published
        if: github.event_name == 'push'
        run: |
          tag=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' charts/filecodebox/Chart.yaml)
          tag=${tag#v}
          echo "等待 ghcr.io/filescodebox/server:${tag} 可拉取..."
          accept='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          deadline=$((SECONDS + 1500))
          while [ "$SECONDS" -lt "$deadline" ]; do
            http=$(curl -s -o /dev/null -w '%{http_code}' -H "$accept" \
              "https://ghcr.io/v2/filescodebox/server/manifests/${tag}")
            [ "$http" = "200" ] && { echo "镜像已发布"; exit 0; }
            echo "  HTTP ${http}，30s 后重试..."
            sleep 30
          done
          echo "::error::ghcr.io/filescodebox/server:${tag} 25 分钟内未发布——server Release 未跑或失败"
          exit 1

      - name: Real install smoke (push)
        if: github.event_name == 'push'
        run: |
          helm lint charts/filecodebox
          helm upgrade --install fcb charts/filecodebox -n fcb-ci --create-namespace \
            -f charts/filecodebox/ci/config-overlay-values.yaml --wait --timeout 5m
          kubectl -n fcb-ci rollout status deploy -l app.kubernetes.io/instance=fcb --timeout=5m
          helm test fcb -n fcb-ci

      - name: Run chart-testing (install)
        if: github.event_name != 'push' && steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}
