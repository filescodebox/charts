name: Lint and Test Charts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      # PR:ct 按变更检测跑 lint+install；
      # push 到 main:ct 的变更检测以 target-branch(=HEAD) 为基线恒空,曾 0 秒空跑、
      # kind 冒烟从未真正执行(--since 对其 version-bump 检查语义也不符,0.2.7 误报)——
      # 故 push 改为下方显式 helm 安装冒烟,零隐式行为。
      - name: Run chart-testing (list-changed)
        id: list-changed
        if: github.event_name != 'push'
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: github.event_name != 'push' && steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: github.event_name == 'push' || steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      # chart bump 与 server 打 tag 几乎同时(依赖升级提交同时触发两条流水线),
      # 多架构镜像(qemu arm64)要 10-30 分钟才 publish;kind 只等 5m,不等镜像
      # 就会 ImagePullBackOff 超时(0.2.12/0.2.13 均如此)。
      # 探测用 docker pull 重试——ghcr 的 registry HTTP API 对 runner 网段匿名
      # manifest GET 恒 401(本机同请求 200),不可用作探测;docker 拉取路径没问题。
      # 拉到后 kind load 预载,部署按 IfNotPresent 直接用,不依赖节点实时拉取。
      - name: Wait for app images & preload into kind (push)
        if: github.event_name == 'push'
        run: |
          tag=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' charts/filecodebox/Chart.yaml)
          tag=${tag#v}
          # 前后端分离落地(chart 带 frontend-deployment)后,两镜像同版本列车都要等
          images="server"
          [ -f charts/filecodebox/templates/frontend-deployment.yaml ] && images="server frontend"
          for image in $images; do
            ref="ghcr.io/filescodebox/${image}:${tag}"
            echo "等待 ${ref} 可拉取..."
            ok=0
            for i in $(seq 1 90); do
              if docker pull "$ref"; then ok=1; break; fi
              echo "  未发布，30s 后重试（$i/90）..."
              sleep 30
            done
            [ "$ok" = "1" ] || { echo "::error::${ref} 25 分钟内未发布——对应 Release 未跑或失败"; exit 1; }
            kind load docker-image "$ref" --name chart-testing
          done

      - name: Real install smoke (push)
        if: github.event_name == 'push'
        run: |
          helm lint charts/filecodebox
          helm upgrade --install fcb charts/filecodebox -n fcb-ci --create-namespace \
            -f charts/filecodebox/ci/config-overlay-values.yaml --wait --timeout 5m
          kubectl -n fcb-ci rollout status deploy -l app.kubernetes.io/instance=fcb --timeout=5m
          helm test fcb -n fcb-ci

      # 内置 MinIO 实装验证(默认关闭,独立 namespace 验证建桶 init + FCB_STORAGE_* 接线)
      - name: MinIO install smoke (push)
        if: github.event_name == 'push'
        run: |
          helm upgrade --install fcb-minio charts/filecodebox -n fcb-minio --create-namespace \
            -f charts/filecodebox/ci/config-overlay-values.yaml \
            --set fullnameOverride=fcb-minio --set minio.enabled=true --wait --timeout 8m
          kubectl -n fcb-minio rollout status statefulset/fcb-minio-minio --timeout=5m
          kubectl -n fcb-minio rollout status deploy/fcb-minio-filecodebox --timeout=8m
          kubectl -n fcb-minio get deploy fcb-minio-filecodebox -o jsonpath='{.spec.template.spec.initContainers[*].name}' | grep -q wait-minio-bucket

      # 冒烟失败时必须留下 Pod 级证据:此前三连挂时失败日志只有一行
      # "Deployment not ready 0/1",分不清是镜像未发布/init 容器卡住/探针语法哪层的问题。
      - name: Dump failure diagnostics (push)
        if: failure() && github.event_name == 'push'
        run: |
          kubectl -n fcb-ci get deploy,sts,po -o wide || true
          echo '──────── events ────────'
          kubectl -n fcb-ci get events --sort-by=.lastTimestamp | tail -40 || true
          for p in $(kubectl -n fcb-ci get po -o name); do
            echo "──────── $p ────────"
            kubectl -n fcb-ci describe "$p" | sed -n '/^Events:/,$p' || true
            kubectl -n fcb-ci logs "$p" --all-containers --init-containers --tail=50 || true
          done

      - name: Run chart-testing (install)
        if: github.event_name != 'push' && steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}
