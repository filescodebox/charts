name: Lint and Test Charts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      # list-changed 以 target-branch 为基线，只对 PR 有意义；
      # push 到 main 时基线即 HEAD，ct 内部变更检测恒空、lint/install 会 0 秒空跑
      # (0.2.7 前的 kind 冒烟从未真正执行过)——push 事件改用 --since HEAD~1
      # 让 ct 以"上一个提交"为基线，本提交动了 chart 就真装一次。
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: github.event_name == 'push' || steps.list-changed.outputs.changed == 'true'
        run: ct lint ${{ github.event_name == 'push' && '--since HEAD~1' || format('--target-branch {0}', github.event.repository.default_branch) }}

      - name: Create kind cluster
        if: github.event_name == 'push' || steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1

      - name: Run chart-testing (install)
        if: github.event_name == 'push' || steps.list-changed.outputs.changed == 'true'
        run: ct install ${{ github.event_name == 'push' && '--since HEAD~1' || format('--target-branch {0}', github.event.repository.default_branch) }}
