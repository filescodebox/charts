name: Release Charts

on:
  push:
    branches:
      - main
  # 供 sync-appversion（GITHUB_TOKEN push 不触发其他工作流）显式调用发版
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          # 同版本已发布时优雅跳过(否则任何不带版本 bump 的 push 都会
          # 因 422 tag_name already_exists 把本工作流打红)
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # v1.7.0 的 action 无 OCI inputs，用 helm 原生 push 在 Pages 之外追加 OCI 分发
      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to OCI
        run: |
          shopt -s nullglob
          pkgs=(.cr-release-packages/*.tgz)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "无新打包的 chart，跳过 OCI 推送"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            helm push "$pkg" "oci://ghcr.io/${{ github.repository }}"
          done
